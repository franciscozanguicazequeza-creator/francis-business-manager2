name: Construir Francis Business Manager 5.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'FrancisBusinessManager-AndroidStudio-v5.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter projecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projecto
        run: |
          unzip -q FrancisBusinessManager-AndroidStudio-v5.zip -d source
          cd source/FrancisBusinessManagerAndroid
          sed -i "s/versionCode 3/versionCode 5/" app/build.gradle
          sed -i "s/versionName '3.0'/versionName '5.0'/" app/build.gradle

      - name: Compilar aplicação
        working-directory: source/FrancisBusinessManagerAndroid
        run: gradle --no-daemon clean assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Francis-Business-Manager-5.0-APK
          path: source/FrancisBusinessManagerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
